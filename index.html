<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>البلاغة: البيان والبديع - الصف الثاني عشر</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0e3b43;--bg2:#17606b;--gold:#f4c25b;--coral:#ff8a73;--ink:#e9f5f3;--card:#eaf7f4;--dk:#0b2f36;--mint:#7fd6c2}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif}
body{background:radial-gradient(circle at 15% 10%,var(--bg2),var(--bg) 60%)}
#deck{position:fixed;inset:0 0 64px 0}
.sl{position:absolute;inset:0;padding:4vh 6vw 3vh;overflow-y:auto;opacity:0;pointer-events:none;transform:translateX(-60px);transition:.45s}
.sl.on{opacity:1;pointer-events:auto;transform:none}
.sl.past{transform:translateX(60px)}
h1{font:700 clamp(3rem,9vw,7rem)/1.1 Amiri,serif;color:var(--gold)}
h2{font:800 clamp(1.6rem,3.6vw,2.6rem);color:var(--gold);margin-bottom:.6em;border-bottom:3px solid var(--coral);display:inline-block;padding-bottom:.15em}
p.l{font-size:clamp(1.05rem,2vw,1.5rem);line-height:1.9;margin:.5em 0;max-width:62rem}
.c{display:flex;flex-direction:column;justify-content:center;min-height:100%}
.ctr{align-items:center;text-align:center}
.who{margin-top:2.2em;font-size:clamp(1rem,2vw,1.4rem);background:rgba(255,255,255,.1);border:1px solid var(--gold);border-radius:14px;padding:.8em 1.6em;line-height:1.9}
.who b{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px;margin-top:1em}
.card{background:var(--card);color:var(--dk);border-radius:18px;padding:1.2em 1.3em;cursor:pointer;border:3px solid transparent;transition:.25s;font-size:1.1rem;line-height:1.8}
.card:hover{transform:translateY(-6px);border-color:var(--gold)}
.card h3{font-size:1.5rem;color:#0a6b78;margin-bottom:.3em}
.card .hid{max-height:0;overflow:hidden;transition:.4s;opacity:0}
.card.open .hid{max-height:300px;opacity:1;margin-top:.6em}
.card.dim{background:#c9d9d7;opacity:.75}
.map{display:grid;grid-template-columns:1fr 1fr;gap:22px}
@media(max-width:700px){.map{grid-template-columns:1fr}}
.map>div{background:rgba(255,255,255,.08);border-radius:20px;padding:1em 1.3em}
.map h3{color:var(--gold);font-size:1.6rem;margin-bottom:.4em}
.pill{display:inline-block;margin:.25em;padding:.4em 1.1em;border-radius:99px;background:var(--mint);color:var(--dk);font-weight:600;cursor:pointer;font-size:1.1rem;transition:.2s}
.pill:hover{background:var(--gold);transform:scale(1.07)}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:.4em 0 1em}
.tab{font:600 1.15rem Cairo,sans-serif;padding:.5em 1.4em;border-radius:12px;border:2px solid var(--mint);background:transparent;color:var(--ink);cursor:pointer;transition:.2s}
.tab.on{background:var(--gold);color:var(--dk);border-color:var(--gold)}
.pane{background:var(--card);color:var(--dk);border-radius:20px;padding:1.2em 1.5em;animation:pop .35s}
@keyframes pop{from{opacity:0;transform:translateY(14px)}}
.pane .d{font-size:clamp(1.05rem,1.9vw,1.35rem);line-height:1.9}
.ex{font:700 clamp(1.5rem,3.2vw,2.4rem)/1.8 Amiri,serif;margin:.4em 0;color:#08515c;padding:.3em .8em;border-right:6px solid var(--coral);background:#fff;border-radius:10px}
.ex b{font-weight:700;border-radius:8px;padding:0 .15em;transition:.25s}
.ex b.hl{background:var(--gold);color:var(--dk);box-shadow:0 0 0 3px var(--coral)}
.chips{display:flex;gap:9px;flex-wrap:wrap;margin:.5em 0}
.chip{cursor:pointer;padding:.35em 1em;border-radius:10px;background:#cdeae4;font-weight:600;font-size:1.05rem;transition:.2s;border:2px solid transparent}
.chip.hl,.chip:hover{background:var(--gold);border-color:var(--coral)}
.q{margin-top:.8em;background:var(--dk);color:var(--ink);border-radius:14px;padding:.8em 1.2em;font-size:clamp(1.05rem,1.9vw,1.3rem);line-height:1.9}
.q i{font-style:normal;color:var(--gold);font-weight:800}
.q u{text-decoration:none;color:var(--coral);font-weight:700}
.note{margin-top:.8em;font-size:1rem;opacity:.85}
.opt{display:block;width:100%;text-align:right;margin:8px 0;padding:.7em 1.1em;font:600 1.15rem Cairo,sans-serif;border-radius:12px;border:2px solid var(--mint);background:rgba(255,255,255,.07);color:var(--ink);cursor:pointer;transition:.2s}
.opt:hover{background:rgba(255,255,255,.18)}
.opt.ok{background:#2e9e6b;border-color:#2e9e6b}.opt.no{background:#c24b4b;border-color:#c24b4b}
.nb{margin-top:1em;padding:.6em 1.6em;border:0;border-radius:12px;background:var(--gold);color:var(--dk);font:800 1.1rem Cairo,sans-serif;cursor:pointer}
#bar{position:fixed;bottom:0;inset-inline:0;height:64px;display:flex;align-items:center;gap:12px;padding:0 4vw;background:rgba(0,0,0,.35);backdrop-filter:blur(6px)}
#bar button{width:44px;height:44px;border-radius:50%;border:2px solid var(--gold);background:transparent;color:var(--gold);font-size:1.3rem;cursor:pointer}
#bar button:hover{background:var(--gold);color:var(--dk)}
#prog{flex:1;height:8px;background:rgba(255,255,255,.18);border-radius:9px;overflow:hidden}
#prog i{display:block;height:100%;background:linear-gradient(270deg,var(--gold),var(--coral));transition:.4s;width:0}
#cnt{font-weight:600;min-width:4.5em;text-align:center}
#ft{position:fixed;bottom:70px;inset-inline-start:2vw;font-size:.85rem;opacity:.6}
:focus-visible{outline:3px solid var(--coral)}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.big span{display:inline-block;animation:drop .7s backwards}
@keyframes drop{from{opacity:0;transform:translateY(-40px) rotate(-6deg)}}
</style>
</head>

 if(s.k=='tabs')h=`<div class="c"><h2>${s.t}</h2>${s.intro?`<p class="l">${s.intro}</p>`:''}<div class="tabs">${s.tabs.map((t,j)=>`<button class="tab${j?'':' on'}" data-t="${j}">${t.n}</button>`).join('')}</div><div class="pane"></div></div>`;
 if(s.k=='quiz')h=`<div class="c"><h2>اختبر نفسك</h2><div id="qz"></div></div>`;
 if(s.k=='end')h=`<div class="c ctr"><h1 style="font-size:clamp(2.5rem,7vw,5rem)">شكرًا لحسن استماعكم</h1><p class="l">والحمد لله رب العالمين</p><div class="who">عمل الطالب: <b>يوسف عماد تقوائي</b><br>الصف: <b>١٢ع٥</b></div></div>`;
 e.innerHTML=h;D.appendChild(e);
 if(s.k=='tabs'){const pane=e.querySelector('.pane');const show=j=>{const t=s.tabs[j];pane.style.animation='none';pane.offsetWidth;pane.style.animation='';pane.innerHTML=`<div class="d">${t.d}</div><div class="ex">${M(t.ex)}</div><div class="chips">${t.p.map((c,x)=>`<span class="chip" data-k="${x}">${c}</span>`).join('')}</div><div class="q"><i>قالب الأثر:</i> ${t.q.replace(/\(([^)]*)\)/g,'<u>( $1 )</u>')}</div>`;e.querySelectorAll('.tab').forEach((b,x)=>b.classList.toggle('on',x==j))};e.querySelectorAll('.tab').forEach(b=>b.onclick=()=>show(+b.dataset.t));show(0)}
 if(s.k=='quiz'){let q=0,sc=0;const z=e.querySelector('#qz');const r=()=>{if(q>=Q.length){z.innerHTML=`<p class="l">نتيجتك: <b style="color:var(--gold)">${sc} من ${Q.length}</b> ${sc==Q.length?'🎉 ممتاز!':'حاول مرة أخرى'}</p><button class="nb">إعادة الاختبار</button>`;z.querySelector('.nb').onclick=()=>{q=0;sc=0;r()};return}const a=Q[q];z.innerHTML=`<p class="l">${q+1}/${Q.length}: ${a[0]}</p>${a[1].map((o,j)=>`<button class="opt" data-j="${j}">${o}</button>`).join('')}`;z.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(z.dataset.l)return;z.dataset.l=1;const j=+b.dataset.j;if(j==a[2])sc++;b.classList.add(j==a[2]?'ok':'no');z.querySelectorAll('.opt')[a[2]].classList.add('ok');setTimeout(()=>{z.dataset.l='';q++;r()},1300)})};r()}
 return e}
const el=S.map(build);
D.addEventListener('click',e=>{
 const c=e.target.closest('.card');if(c){const g=c.parentNode;if(c.classList.contains('open')){g.querySelectorAll('.card').forEach(x=>x.classList.remove('open','dim'))}else{g.querySelectorAll('.card').forEach(x=>{x.classList.remove('open');x.classList.add('dim')});c.classList.remove('dim');c.classList.add('open')}return}
 const p=e.target.closest('.pill');if(p)return go(+p.dataset.go);
 const h=e.target.closest('.chip');if(h){const pn=h.closest('.pane');const on=!h.classList.contains('hl');pn.querySelectorAll('.hl').forEach(x=>x.classList.remove('hl'));if(on){pn.querySelectorAll(`[data-k="${h.dataset.k}"]`).forEach(x=>x.classList.add('hl'))}}
});
D.addEventListener('keydown',e=>{if(e.key=='Enter'&&e.target.classList.contains('card'))e.target.click()});
// card reveal text initially hidden for 'cards' with extra detail: show hidden text on open
document.querySelectorAll('.card>div').forEach(d=>d.classList.add('hid'));
function go(n){cur=Math.max(0,Math.min(S.length-1,n));el.forEach((e,i)=>{e.classList.toggle('on',i==cur);e.classList.toggle('past',i<cur)});document.querySelector('#prog i').style.width=((cur+1)/S.length*100)+'%';document.getElementById('cnt').textContent=(cur+1)+' / '+S.length;el[cur].scrollTop=0}
nx.onclick=()=>go(cur+1);pv.onclick=()=>go(cur-1);
fs.onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();
addEventListener('keydown',e=>{if(e.key=='ArrowLeft'||e.key==' ')go(cur+1);if(e.key=='ArrowRight')go(cur-1);if(e.key=='Home')go(0);if(e.key=='End')go(S.length-1);if(e.key=='f')fs.click()});
let sx=0;addEventListener('touchstart',e=>sx=e.touches[0].clientX);addEventListener('touchend',e=>{const d=e.changedTouches[0].clientX-sx;if(Math.abs(d)>70)go(cur+(d>0?-1:1))});
go(0);
